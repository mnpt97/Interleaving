[package]
name = "interleaving"
version = "0.1.0"
description = "Interleaving scenario workspace"
edition = "2024"

[dev-dependencies]
axum.workspace = true


[lib]
name = "interleaving_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]


[build-dependencies.tauri-build]
version = "2"
features = [ ]


[dependencies]
tokio.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"


[dependencies.tauri]
version = "2"
features = [ ]


[dependencies.serde]
version = "1"
features = [ "derive" ]


[dependencies.interl-core]
workspace = true


[dependencies.interl-engine]
workspace = true


