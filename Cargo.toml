[workspace]
resolver = "2"
members = [
"apps/desktop/src-tauri",
"crates/interl-core",
"crates/interl-http",
"crates/interl-engine",
"crates/interl-cli"
]


[workspace.package]
version = "0.1.0"
edition = "2021"


[workspace.dependencies]
serde_json = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"


[workspace.dependencies.serde]
version = "1"
features = [ "derive" ]


[workspace.dependencies.tokio]
version = "1"
features = [ "full" ]


[workspace.dependencies.uuid]
version = "1"
features = [ "v4", "serde" ]


[workspace.dependencies.interl-core]
path = "crates/interl-core"


[workspace.dependencies.interl-http]
path = "crates/interl-http"


[workspace.dependencies.interl-engine]
path = "crates/interl-engine"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true


[profile.dev]
incremental = true
